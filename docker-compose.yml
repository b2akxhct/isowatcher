services:
  isowatcher:
    build: .
    container_name: isowatcher
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # ── Base de données SQLite + clé SSH générée (./data/ssh/) ─────────────
      - ./data:/data

      # ── ISOs sur le NAS en CIFS/SMB (Unraid) ───────────────────────────────
      # Remplace par ton chemin de montage CIFS réel
      - /mnt/nas/isos:/data/isos

    environment:
      - DATA_DIR=/data
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/stats"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# ═══════════════════════════════════════════════════════════════════════════════
#  GUIDE DE DÉPLOIEMENT — ARCHITECTURE SSH (Unraid + Proxmox en CIFS)
# ═══════════════════════════════════════════════════════════════════════════════
#
#  ARCHITECTURE :
#    Unraid (NAS)
#      isos/                    ← partage CIFS monté dans ce container (/data/isos)
#        <distro>/<version>/*.iso
#        proxmox-view/template/iso/   ← symlinks créés PAR UNRAID via SSH
#                                        (jamais par ce container — CIFS ne
#                                        supporte pas les symlinks côté client)
#
#    Proxmox
#      Monte proxmox-view/ directement depuis Unraid en CIFS,
#      indépendamment de ce container Docker.
#
#  POURQUOI SSH ET PAS UN MONTAGE LOCAL :
#    Ce container n'a PLUS besoin de monter proxmox-view. La sync se fait
#    en connectant ISOWatcher à Unraid en SSH pour y exécuter
#    sync_symlinks.sh, qui crée les liens directement sur le filesystem
#    XFS natif d'Unraid (où les symlinks fonctionnent normalement).
#
#  ÉTAPE 1 — Monter le NAS CIFS (ISOs uniquement)
#  ─────────────────────────────────────────────
#    apt install cifs-utils -y
#    mkdir -p /mnt/nas/isos
#    cat > /etc/nas-creds << 'CREDS'
#    username=VOTRE_USER
#    password=VOTRE_MOT_DE_PASSE
#    CREDS
#    chmod 600 /etc/nas-creds
#    echo "//192.168.1.X/isos  /mnt/nas/isos  cifs  credentials=/etc/nas-creds,_netdev,nofail,uid=0,gid=0  0  0" >> /etc/fstab
#    mount -a
#
#  ÉTAPE 2 — Copier le script sur Unraid
#  ───────────────────────────────────────
#    scp sync_symlinks.sh root@UNRAID_IP:/mnt/user/isos/isowatcher/
#    ssh root@UNRAID_IP "chmod +x /mnt/user/isos/isowatcher/sync_symlinks.sh"
#
#  ÉTAPE 3 — Démarrer ISOWatcher
#  ──────────────────────────────
#    docker compose up -d
#
#  ÉTAPE 4 — Configurer SSH depuis l'interface
#  ──────────────────────────────────────────────
#    Interface → Proxmox Sync :
#      - Générer une clé SSH (bouton dédié)
#      - Copier la clé publique dans /root/.ssh/authorized_keys sur Unraid
#      - Renseigner IP Unraid, chemins source/destination, chemin du script
#      - Tester SSH → Synchroniser
#
#  ÉTAPE 5 — Déclarer le storage Proxmox
#  ───────────────────────────────────────
#    Ajouter dans /etc/pve/storage.cfg (monte proxmox-view directement
#    depuis Unraid — indépendant de ce container Docker) :
#
#    dir: isowatcher
#      path /mnt/proxmox-view
#      content iso
#
#    Vérifier : pvesm list isowatcher
#
